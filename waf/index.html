<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Test WAF</title>
</head>
<body style="font-size:28px; padding:20px">
    <h1>Test WAF</h1>
    <h2>Hello world!</h2>
    <p id="status">Setting title...</p>

    <script>
        var kindle = window.kindle || top.kindle;

        function update() {
            var chromebar = {
                "appId": "com.lab126.helpapp",
                "topNavBar": {
                    "template": "title",
                    "title": "WAF loaded and configureChrome succeeded!",
                    "buttons": [
                        { "id": "KPP_CLOSE", "state": "enabled", "handling": "system" }
                    ]
                }
            };
            kindle.messaging.sendMessage("com.lab126.chromebar", "configureChrome", chromebar);
            document.getElementById("status").innerText = "Sent configureChrome!";
        }

        update();

        if (kindle.appmgr) {
            kindle.appmgr.ongo = function () { update(); };
        }
    </script>
</body>
</html>
